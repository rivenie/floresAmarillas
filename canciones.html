<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Jazmín 🌼</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff9e6 0%, #ffeaa7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            color: #4a3f1f;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(212, 160, 23, 0.2);
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        p {
            margin-bottom: 25px;
            color: #7a6a3a;
            font-weight: 300;
        }
        .song {
            display: block;
            background: #fdc500;
            color: #4a3f1f;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 600;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(253, 197, 0, 0.3);
        }
        .song:hover {
            background: #ffd60a;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(253, 197, 0, 0.5);
        }
        .flower {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="flower">🌻</div>
        <h1>Para ti, Jazmín</h1>
        <p>Estas canciones me recuerdan a ti.<br>Escúchalas cuando quieras.</p>

        <a href="https://www.youtube.com/watch?v=R7vwS9W-eo4" target="_blank" class="song">🎵 Canción 1</a>
        <a href="https://www.youtube.com/watch?v=0DJNc8dXsfo" target="_blank" class="song">🎵 Canción 2</a>
        <a href="https://www.youtube.com/watch?v=YWN81V7ojOE" target="_blank" class="song">🎵 Canción 3</a>

        <p style="margin-top: 30px; font-family: 'Dancing Script', cursive; font-size: 1.5rem; color: #d4a017;">Con cariño, José Antonio</p>
    </div>
</body>
</html>
